[project]
name = "crochet-reconstruction"
version = "0.1.0"
description = "Deterministic crochet pattern generation and validation engine (Phase 1: top-down beanie foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "lark>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]
portal = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12,<0.1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pillow>=10.4,<11",
    "itsdangerous>=2.2,<3",
]
api = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
]

[project.scripts]
crochet-reconstruction = "crochet_reconstruction.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Jinja2 templates and static assets are not .py files, so setuptools
# excludes them by default - without this, a built wheel/Docker image would
# install a portal package with no templates directory at all.
"crochet_reconstruction.portal" = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; hand-editing generated migrations for line
# length is worse than excluding them from the check.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires `Depends(...)` as a
# parameter default. Ruff already special-cases this for route handlers;
# this extends the same allowance to plain dependency-provider functions
# (e.g. require_admin) that aren't themselves route-decorated.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["crochet_reconstruction"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
