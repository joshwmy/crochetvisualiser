<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crochet Project Submission{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Crochet Project Submission</h1>
  </header>
  <div class="container">
    {% if flash %}
      <div class="alert {{ flash.level }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
  <footer class="site-footer">
    This is a research and product-development pilot. Your submitted photos
    are private by default and never shown publicly unless you specifically
    agree to that. You can withdraw at any time.
  </footer>
</body>
</html>
