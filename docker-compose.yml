# Local production-like testing. Not a multi-service stack — SQLite lives on
# the mounted volume alongside images, so no separate database container.
services:
  portal:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORTAL_ENVIRONMENT: production
      PORTAL_DATA_DIR: /data
    volumes:
      - portal_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portal_data:
